---
basic_http_auth: false
# defaults file for ckan
ckan_pod_replicas_nr: 1

ckan_uwsgi_processes: 4
ckan_uwsgi_threads: 2

# Per-source-IP request/connection caps on the ckan ingress. Unset (empty)
# by default to preserve existing behaviour for consumers of this role;
# set ckan_ingress_limit_rps to enable.
ckan_ingress_limit_rps: ""
ckan_ingress_limit_connections: 20
# Per-/24-subnet request rate, applied alongside the per-IP cap above
# whenever ckan_ingress_limit_rps is set. Only matters if the two ever
# need to move independently; the default keeps today's tuning.
ckan_ingress_limit_subnet_rps: 20

# Cluster Autoscaler, deployed once per EKS cluster (skipped for local/
# minikube). Version tracks the cluster's k8s minor version — see
# https://github.com/kubernetes/autoscaler/releases for compatible tags.
cluster_autoscaler_image_tag: "v1.36.0"

ckan_slack_webhook: "dummyvalue"
ckan_backup_bucket_name: "dummyvalue"
ckan_backup_access_key: "dummyvalue"
ckan_backup_access_secret: "dummyvalue"
ckan_backup_s3: "dummyvalue"
ckan_backup_sql_directory_s3: "dummyvalue"
ckan_backup_postgres_version: 14
ckan_awscli_image_tag: "latest"
ckan_debug_enabled: "false"

fjelltopp_base_image: "fjelltopp/ubuntu:base"

ckan_admin_api_token: dummyvalue

ckan_recaptcha_publickey: ""
ckan_recaptcha_privatekey: ""

ckan_create_user_via_api: "false"
ckan_create_user_via_web: "true"
ckan_collaborators: "false"
ckan_default_views: "image_view text_view recline_view"

restore_production_backup: true

ckan_extras: |-


