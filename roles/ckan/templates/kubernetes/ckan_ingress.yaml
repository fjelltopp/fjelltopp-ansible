{% if basic_http_auth %}
---
apiVersion: v1
data:
  auth: {{ basic_http_auth_secret }}
kind: Secret
metadata:
  name: basic-auth
type: Opaque

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ckan-api-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
{% if ckan_ingress_limit_rps %}
    # See ckan-ingress below — same rationale applies to /api/* traffic,
    # which hits the same uwsgi worker pool and would otherwise bypass
    # the limit entirely when basic_http_auth splits it into this ingress.
    nginx.ingress.kubernetes.io/limit-rps: "{{ ckan_ingress_limit_rps }}"
    nginx.ingress.kubernetes.io/limit-connections: "{{ ckan_ingress_limit_connections }}"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      limit_req zone=ckan_subnet_24 burst={{ (ckan_ingress_limit_subnet_rps | default(20)) * 2 }} nodelay;
{% endif %}
spec:
  rules:
    - host: "{{ ckan_fqdn }}"
      http:
        paths:
          - path: /api/(.*)
            pathType: Prefix
            backend:
              service:
                name: ckan
                port:
                  name: ckan
          - path: /dataset/(.*)/resource/(.*)/download/(.*)
            pathType: Prefix
            backend:
              service:
                name: ckan
                port:
                  name: ckan
{% endif %}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ckan-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
{% if ckan_ingress_limit_rps %}
    # Per-source-IP throughput cap. Protects the fixed-size uwsgi worker
    # pool from being saturated by a single high-volume client (scraper
    # bursts, misbehaving crawlers), which otherwise queues *all* traffic,
    # including unrelated readiness/liveness checks, behind it.
    nginx.ingress.kubernetes.io/limit-rps: "{{ ckan_ingress_limit_rps }}"
    nginx.ingress.kubernetes.io/limit-connections: "{{ ckan_ingress_limit_connections }}"
    # Per-/24-subnet cap on top of the per-IP one above. Catches scrapers
    # that rotate through many source IPs in the same cloud range, where
    # no single IP crosses the per-IP limit but the subnet's aggregate
    # volume does. See the ckan_subnet_24 zone in the ingress-nginx
    # controller's ConfigMap (nginx-ingress-tls-elb_v1_0_0.yaml).
    nginx.ingress.kubernetes.io/configuration-snippet: |
      limit_req zone=ckan_subnet_24 burst={{ (ckan_ingress_limit_subnet_rps | default(20)) * 2 }} nodelay;
{% endif %}
{% if basic_http_auth %}
    # Basic http auth
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required for {{ ckan_fqdn }} '
{% endif %}
spec:
  rules:
    - host: "{{ ckan_fqdn }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ckan
                port:
                  name: ckan
