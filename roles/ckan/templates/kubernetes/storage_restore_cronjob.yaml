---
apiVersion: v1
kind: Secret
metadata:
  name: ckan-storage-restore
data:
  storage_restore.sh: "{{ lookup('template', 'templates/ckan/storage_restore.sh') | b64encode }}"
type: Opaque

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-ckan-storage
spec:
  schedule: "17 5 * * *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            fsGroup: 900
          containers:
          - name: ckan-storage-restore
            image: amazon/aws-cli:latest
            command: ['bash', '-c']
            args:
              - bash /tmp/storage_restore.sh
            volumeMounts:
              - mountPath: /tmp/storage_restore.sh
                name: ckan-storage-restore
                readOnly: true
                subPath: storage_restore.sh
              - mountPath: /var/lib/ckan/storage
                name: ckan-storage
          restartPolicy: Never
          volumes:
            - secret:
                secretName: ckan-storage-restore
              name: ckan-storage-restore
            - name: ckan-storage
              persistentVolumeClaim:
                claimName: ckan-storage
      backoffLimit: 1
